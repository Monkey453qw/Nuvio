name: Build custom branch APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-custom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble arm64-v8a release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure build properties
        run: |
          keystore_path="${RUNNER_TEMP}/nuvio-custom-release.jks"
          cp keystore/nuvio-custom-release.jks "${keystore_path}"
          cat > local.properties <<EOF
          NUVIO_RELEASE_STORE_FILE=${keystore_path}
          NUVIO_RELEASE_STORE_PASSWORD=NuvioCustom2026
          NUVIO_RELEASE_KEY_ALIAS=nuvio-custom
          NUVIO_RELEASE_KEY_PASSWORD=NuvioCustom2026
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
          NUVIO_SUPABASE_FALLBACK_URL=https://api-two.nuvioapp.space
          TMDB_API_KEY=01926d2187b6a5d861eefc750e9df3e3
          TRAKT_CLIENT_ID=5783db7c46a5b22f072d4b224f9bd7dc2cbaba66dbe3515d1feb59e3ca72394c
          TRAKT_CLIENT_SECRET=bf6e7561dafee902f5a2a67d2b31feac1563632f331f3958c978aff6389ea384
          SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6
          SENTRY_DSN=https://a4f60d0d86876166059c050511332924@o4511671534354432.ingest.us.sentry.io/4511676526166016
          INTRODB_API_URL=https://api.introdb.app/
          IMDB_RATINGS_API_BASE_URL=https://api.mdblist.com/imdb/
          IMDB_TAPFRAME_API_BASE_URL=https://imdb.tapframe.space/
          EOF

      - name: Build arm64-v8a release APK (single variant)
        run: ./gradlew :androidApp:assembleFullRelease -PnuvioAbiFilter=arm64-v8a --stacktrace

      - name: Collect the single arm64-v8a APK
        run: |
          set -euo pipefail
          cd androidApp/build/outputs/apk/full/release
          ls -la
          shopt -s nullglob
          apks=(*arm64-v8a*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "Expected exactly one arm64-v8a APK, found ${#apks[@]}: ${apks[*]}" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/out"
          cp "${apks[0]}" "${RUNNER_TEMP}/out/Nuvio-arm64-v8a-release.apk"
          sha256sum "${RUNNER_TEMP}/out/Nuvio-arm64-v8a-release.apk"

      - name: Upload artifact (single arm64-v8a APK)
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-arm64-v8a
          path: ${{ runner.temp }}/out/Nuvio-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach raw APK to release (no zip needed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create custom-latest \
            --target "$GITHUB_SHA" \
            --title "Custom build (arm64-v8a)" \
            --notes "Latest custom branch build. Single variant: arm64-v8a only." \
            || true
          gh release upload custom-latest \
            "${RUNNER_TEMP}/out/Nuvio-arm64-v8a-release.apk" --clobber

      - name: Summary
        run: |
          {
            echo "### Build result"
            echo ""
            echo "- Single variant: **arm64-v8a** only (no other variants were built)."
            echo "- Download the raw APK, no zip: **Releases → custom-latest → Nuvio-arm64-v8a-release.apk**."
            echo "- Or from this run's artifact: **nuvio-arm64-v8a** (contains that same single APK)."
          } >> "$GITHUB_STEP_SUMMARY"
